{% extends "base.html" %}

{% block content %}
<div style="max-width:480px; margin:40px auto; background:var(--theme-card-bg); padding:25px; border-radius:12px; border:1px solid var(--theme-border);">
    <h2>Security Update Required</h2>
    <p style="color:var(--theme-muted-text);">
        Create a password with at least 5 characters, including a letter, number, and special character.
    </p>

    <form method="post">
        <label>Current PIN or password</label>
        <input type="password" name="current_password" required autocomplete="current-password">

        <label>New password</label>
        <input type="password" name="new_password" required minlength="5" autocomplete="new-password">

        <label>Confirm new password</label>
        <input type="password" name="confirm_password" required minlength="5" autocomplete="new-password">

        <button type="submit">Update Password</button>
    </form>
</div>
{% endblock %}
