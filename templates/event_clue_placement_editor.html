{% extends "base.html" %}{% block content %}{% include '_event_workspace_nav.html' %}<h3>Edit website entrance</h3><p style="opacity:.65;">This controls how players discover and enter the event.</p><form method="post" style="max-width:850px;background:var(--theme-card-bg);border:1px solid var(--theme-border);border-radius:12px;padding:20px;"><label>Internal name<input name="name" value="{{ placement[1] }}" required></label><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;"><label>Page<select name="page_scope">{% for v in ['store','dashboard','profile','purchases','global'] %}<option value="{{ v }}" {% if placement[2]==v %}selected{% endif %}>{{ v|title }}</option>{% endfor %}</select></label><label>Location<select name="placement_zone">{% for v in ['theme_banner_hotspot','content_top','floating_corner','footer'] %}<option value="{{ v }}" {% if placement[3]==v %}selected{% endif %}>{{ v|replace('_',' ')|title }}</option>{% endfor %}</select></label><label>Appearance<select name="display_type">{% for v in ['invisible_hotspot','image','text'] %}<option value="{{ v }}" {% if placement[4]==v %}selected{% endif %}>{{ v|replace('_',' ')|title }}</option>{% endfor %}</select></label></div><label>Text or symbol<input name="label" value="{{ placement[5] or '' }}"></label><label>Hover tooltip<input name="tooltip" value="{{ placement[6] or '' }}"></label><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;"><label>X %<input name="position_x" type="number" step=".1" value="{{ placement[7] }}"></label><label>Y %<input name="position_y" type="number" step=".1" value="{{ placement[8] }}"></label><label>Width %<input name="width_percent" type="number" step=".1" value="{{ placement[9] }}"></label><label>Height %<input name="height_percent" type="number" step=".1" value="{{ placement[10] }}"></label></div><label style="display:flex;gap:8px;align-items:center;"><input type="checkbox" name="is_active" {% if placement[13] %}checked{% endif %} style="width:auto;margin:0;">Active</label><button type="submit" style="width:auto;">Save entrance</button> <a href="{{ url_for('event_clue_placements',event_id=event[0]) }}" style="color:var(--theme-muted-text);padding:10px;">Cancel</a></form>{% endblock %}
