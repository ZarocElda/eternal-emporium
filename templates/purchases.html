{% extends "base.html" %}

{% block content %}

<h2>My Purchases</h2>

<table border="1">
<tr>
    <th>Item</th>
    <th>Cost</th>
    <th>Date</th>
</tr>

{% for p in purchases %}
<tr>
    <td>{{ p[0] }}</td>
    <td>{{ p[1] }}</td>
    <td>{{ p[2] }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
