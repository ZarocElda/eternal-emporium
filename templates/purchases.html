{% extends "base.html" %}

{% block content %}

<h2>My Purchases</h2>

<table>
<tr>
    <th>Item</th>
    <th>Quantity</th>
    <th>Total Cost</th>
    <th>Date</th>
</tr>

{% for p in purchases %}
<tr>
    <td>{{ p[0] }}</td>        <!-- item -->
    <td>{{ p[1] }}</td>        <!-- quantity -->
    <td>{{ p[2] }} pts</td>    <!-- total cost -->
    <td>{{ p[3] }}</td>        <!-- timestamp -->
</tr>
{% endfor %}

</table>

{% endblock %}
