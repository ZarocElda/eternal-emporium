{% extends "base.html" %}

{% block content %}

<div style="
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:80vh;
    text-align:center;
">

    <!-- LOGO -->
    <img src="{{ url_for('static', filename='er_logo.png') }}" style="
        width:70px;
        margin-bottom:10px;
        filter: drop-shadow(0 0 12px rgba(59,130,246,0.6));
    ">

    <!-- TITLE -->
    <h1 style="
        font-size:32px;
        margin-bottom:5px;
    ">
        Create Account
    </h1>

    <p style="
        opacity:0.7;
        margin-bottom:25px;
    ">
        Choose a username and a 4-digit PIN
    </p>

    <!-- CARD -->
    <div class="card" style="
        width:340px;
        padding:30px;
        text-align:left;
    ">

        {% if error %}
            <p style="color:#ef4444;">{{ error }}</p>
        {% endif %}

        <form method="post">

            <!-- USERNAME -->
            <label style="font-size:13px; opacity:0.7;">Username</label>
            <input name="username" placeholder="Enter username" required
            style="width:95%; margin: 0 auto 16px auto; display:block;"
            >

            <!-- PIN -->
            <label style="font-size:13px; opacity:0.7;">4-Digit PIN</label>
            <input 
                name="pin"
                placeholder="1234"
                maxlength="4"
                inputmode="numeric"
                pattern="[0-9]*"
                required
                style="width:95%; margin: 0 auto 16px auto; display:block;"
            >

            <!-- CONFIRM PIN -->
            <label style="font-size:13px; opacity:0.7;">Confirm PIN</label>
            <input 
                name="verify"
                placeholder="1234"
                maxlength="4"
                inputmode="numeric"
                pattern="[0-9]*"
                required
                style="width:95%; margin: 0 auto 16px auto; display:block;"
            >

            <button type="submit" style="margin-top:15px;">
                Create Account
            </button>

        </form>

    </div>

</div>

{% endblock %}
